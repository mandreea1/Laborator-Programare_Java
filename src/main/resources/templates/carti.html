<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet" integrity="sha384-
	1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>Lista Cărți</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>Lista Cărți</h1>
	<form method="post" action="/operatii">
	    <input type="text" name="isbn" placeholder="ISBN..." class="form-control mb-2" />
	    <input type="text" name="titlul" placeholder="Titlul..." class="form-control mb-2" />
	    <input type="text" name="autorul" placeholder="Autorul..." class="form-control mb-2" />
	    <button type="submit" name="adauga" class="btn btn-success">Adaugă</button>
	    <button type="submit" name="sterge" class="btn btn-danger">Șterge</button>
	    <button type="submit" name="filtreaza" class="btn btn-primary">Filtrează</button>
	    <button type="submit" name="modifica" class="btn btn-warning">Modifică</button>
	</form>
	
    <p th:text="${mesaj}" class="mt-2"></p>
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>ID</th>
                <th>ISBN</th>
                <th>Titlul</th>
                <th>Autorul</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="carte : ${lista}">
                <td th:text="${carte.id}"></td>
                <td th:text="${carte.isbn}"></td>
                <td th:text="${carte.titlul}"></td>
                <td th:text="${carte.autorul}"></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
